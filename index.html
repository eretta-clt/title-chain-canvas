<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Title Chain Canvas</title>
<style>
  :root{
    --bg:#eef1f5; --panel:#ffffff; --ink:#1f2733; --muted:#6b7686;
    --line:#d9dee6; --accent:#1f5fa8; --accent-d:#164a86;
    --shadow:0 1px 3px rgba(20,30,50,.09),0 8px 24px rgba(20,30,50,.07);
    --canvas-bg:#f3f5f9; --dot:#d3d9e3;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font:13.5px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg);overflow:hidden}
  button{font:inherit;cursor:pointer}
  input,select,textarea{font:inherit;color:inherit}

  .app-grid{display:flex;flex-direction:column;height:100vh}

  /* ---- Top bar ---- */
  header.app{background:linear-gradient(180deg,#22344b,#1a2739);color:#eaf0f8;display:flex;align-items:center;gap:14px;padding:9px 16px;box-shadow:0 2px 10px rgba(0,0,0,.18);z-index:30}
  header.app .brand{font-size:15px;font-weight:650;white-space:nowrap}
  header.app .brand .mark{color:#7fb3ec}
  .proj-name{background:rgba(255,255,255,.08);border:1px solid #3a4d68;color:#eaf0f8;border-radius:7px;padding:5px 10px;font-weight:600;min-width:180px}
  .proj-name:focus{outline:none;border-color:#7fb3ec;background:rgba(255,255,255,.14)}
  .spacer{flex:1}
  .tbtns{display:flex;gap:7px;flex-wrap:wrap}
  .btn{border:1px solid #3d5171;border-radius:8px;padding:6px 11px;font-size:12.5px;font-weight:550;background:#31445e;color:#dce6f4}
  .btn:hover{background:#3b5273}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{background:var(--accent-d)}
  .btn.ghost{background:transparent;border-color:#41567a;color:#c4d4ea}
  .btn.ghost:hover{background:#2a3b53}

  /* ---- Toolbar (parcels + tools) ---- */
  .toolbar{display:flex;align-items:center;gap:10px;padding:6px 12px;background:#fff;border-bottom:1px solid var(--line);z-index:20}
  .parcels{display:flex;gap:5px;align-items:center;overflow-x:auto;flex:1;min-width:0}
  .ptab{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:#f6f8fb;border-radius:8px;padding:5px 9px;white-space:nowrap;color:#3a4658;font-weight:600;font-size:12.5px}
  .ptab .swatch{width:9px;height:9px;border-radius:3px}
  .ptab.active{background:#e8f0fb;border-color:#bcd6f4;color:var(--accent-d);box-shadow:inset 0 0 0 1px #cfe0f6}
  .ptab .close{border:none;background:none;color:#9aa6b6;font-size:14px;line-height:1;padding:0 0 0 2px}
  .ptab .close:hover{color:#b02a37}
  .ptab.addp{background:#fff;color:var(--accent);font-weight:700}
  .tools{display:flex;align-items:center;gap:7px}
  .tool{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;font-weight:600;color:#3a4658;font-size:12.5px}
  .tool:hover{background:#f2f5f9;border-color:#c6cfdb}
  .tool.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .tool.primary:hover{background:var(--accent-d)}
  .tool:disabled{opacity:.35;cursor:default;background:#fff;border-color:var(--line)}
  #btnUndo,#btnRedo{font-size:16px;line-height:1;padding:5px 10px;min-width:34px}
  .newkind{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:#fff}
  .zoom{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:8px;padding:2px 4px}
  .zoom button{border:none;background:none;font-size:15px;width:24px;color:#3a4658}
  .zoom span{font-size:12px;color:var(--muted);min-width:38px;text-align:center}

  /* ---- Stage ---- */
  .stage{flex:1;display:flex;min-height:0}
  .canvas{position:relative;flex:1;overflow:hidden;background:var(--canvas-bg);
    background-image:radial-gradient(var(--dot) 1.3px,transparent 1.3px);
    background-size:24px 24px;cursor:default;
    touch-action:none;-ms-touch-action:none;-webkit-tap-highlight-color:transparent}
  .canvas.panning{cursor:grabbing}
  #world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
  #arrows{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none;z-index:1}

  .box{position:absolute;width:222px;background:#fff;border:1px solid var(--line);border-top:3px solid var(--accent);
    border-radius:10px;box-shadow:var(--shadow);padding:9px 11px 11px;z-index:2;cursor:grab;user-select:none}
  .box:active{cursor:grabbing}
  .box.bgap{box-shadow:0 0 0 2px #e0616b,var(--shadow)}
  .box.bover{box-shadow:0 0 0 2px #d99a2b,var(--shadow)}
  .box.sel{box-shadow:0 0 0 2px var(--accent),var(--shadow)!important}
  .box .kind{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;padding:2px 7px;border-radius:20px;margin-bottom:6px}
  .box .ibadge{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;margin:0 0 6px 4px;background:#efeafe;color:#5b3ad6;vertical-align:top}
  .box .schip{display:inline-flex;align-items:center;gap:4px;margin-top:9px;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:20px}
  .box .schip.ok{background:#e7f6ec;color:#1c7a43}
  .box .schip.gap{background:#fdeced;color:#b02a37}
  .box .schip.over{background:#fff4dd;color:#8a5a00}
  .box .schip.origin{background:#eceafe;color:#5b3ad6}
  .box .party{font-size:13.5px;font-weight:650;color:#1f2733;word-break:break-word;line-height:1.25}
  .box .to{color:var(--muted);font-size:11px;text-align:center;margin:1px 0}
  .box .grantee{font-weight:600;color:#33455f}
  .box .ph{color:#aab3c0;font-weight:500;font-style:italic}
  .box .meta{margin-top:7px;padding-top:7px;border-top:1px dashed #e6eaf0;display:flex;flex-direction:column;gap:2px;font-size:11.5px;color:#556}
  .box .meta .row{display:flex;gap:6px}
  .box .meta .lab{color:#93a0b2;min-width:34px;font-weight:600}
  .box .handle{position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);width:15px;height:15px;border-radius:50%;
    background:#fff;border:2px solid var(--accent);cursor:crosshair;z-index:3;opacity:.35;transition:opacity .1s}
  .box:hover .handle,.box.sel .handle{opacity:1}
  .box .handle:hover{background:var(--accent);transform:translateX(-50%) scale(1.25)}
  /* touch / stylus: bigger, always-visible handles and roomier tap targets */
  @media (hover:none),(pointer:coarse){
    .box .handle{opacity:1;width:22px;height:22px;bottom:-12px;border-width:3px}
    .icon-btn,.tool,.zoom button{min-height:34px}
    .ptab{padding:8px 11px}
  }
  /* narrower tablet widths: slimmer inspector */
  @media (max-width:900px){
    .inspector{width:264px}
    header.app{gap:10px;flex-wrap:wrap}
    .proj-name{min-width:130px}
  }

  /* three-dot actions on the box itself */
  .box .bmenu{position:absolute;top:5px;right:5px;width:24px;height:22px;border:none;border-radius:6px;
    background:rgba(255,255,255,.9);color:#9aa6b6;font-size:15px;line-height:1;padding:0;cursor:pointer;
    display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .1s}
  .box:hover .bmenu,.box.sel .bmenu{opacity:1}
  .box .bmenu:hover{background:#eef2f7;color:#33445c}
  @media (hover:none),(pointer:coarse){.box .bmenu{opacity:1;width:30px;height:27px;font-size:17px}}
  .bmenu-pop{position:fixed;z-index:250;background:#fff;border:1px solid var(--line);border-radius:9px;
    box-shadow:0 8px 26px rgba(20,30,50,.20);padding:5px;min-width:150px;display:flex;flex-direction:column;gap:2px}
  .bmenu-pop button{border:none;background:none;text-align:left;padding:8px 10px;border-radius:6px;
    font-size:13px;font-weight:600;color:#33445c;cursor:pointer;display:flex;align-items:center;gap:8px}
  .bmenu-pop button:hover{background:#f2f5f9}
  .bmenu-pop button.danger{color:#b02a37}
  .bmenu-pop button.danger:hover{background:#fdeced}
  .bmenu-pop .mi{width:16px;text-align:center;opacity:.75}
  .dup-btn{width:100%;border:1px solid var(--line);background:#fff;color:#33445c;border-radius:8px;
    padding:8px;font-weight:650;cursor:pointer}
  .dup-btn:hover{background:#f2f5f9;border-color:#c6cfdb}

  /* ---- Projects page ---- */
  .projpage{position:fixed;inset:0;z-index:300;background:var(--bg);display:flex;flex-direction:column}
  .projbar{display:flex;align-items:center;gap:12px;padding:12px 18px;background:linear-gradient(180deg,#22344b,#1a2739);
    color:#eaf0f8;box-shadow:0 2px 10px rgba(0,0,0,.18);flex-wrap:wrap}
  .projttl{font-size:16px;font-weight:650;white-space:nowrap}
  .projsearch{flex:1;min-width:160px;background:rgba(255,255,255,.08);border:1px solid #3a4d68;color:#eaf0f8;
    border-radius:8px;padding:7px 11px;font-size:13px}
  .projsearch::placeholder{color:#8ea3bd}
  .projsearch:focus{outline:none;border-color:#7fb3ec;background:rgba(255,255,255,.14)}
  .projbody{flex:1;overflow:auto;padding:18px}
  .projgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;max-width:1300px;margin:0 auto}
  .projcard{background:#fff;border:1px solid var(--line);border-radius:11px;padding:14px 15px;box-shadow:var(--shadow);
    cursor:pointer;display:flex;flex-direction:column;gap:5px;transition:border-color .1s,box-shadow .1s}
  .projcard:hover{border-color:#bcd6f4;box-shadow:0 4px 16px rgba(20,30,50,.12)}
  .projcard.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),var(--shadow)}
  .pc-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
  .pc-name{font-size:14.5px;font-weight:650;color:var(--ink);word-break:break-word;line-height:1.3}
  .pc-cur{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--accent-d);
    background:#e8f0fb;border:1px solid #cfe0f6;border-radius:20px;padding:2px 7px;white-space:nowrap;flex-shrink:0}
  .pc-meta{font-size:12px;color:var(--muted)}
  .pc-when{font-size:11.5px;color:#93a0b2}
  .pc-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:2px}
  .pc-tags span{font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px}
  .tagd{background:#e7f6ec;color:#1c7a43;border:1px solid #a9dcbc}
  .tagl{background:#eef1f6;color:#5b6a7d;border:1px solid #dde3ec}
  .pc-acts{display:flex;gap:6px;margin-top:9px;padding-top:9px;border-top:1px solid #eef1f6;flex-wrap:wrap}
  .pc-btn{border:1px solid var(--line);background:#fff;border-radius:7px;padding:5px 10px;font-size:12px;
    font-weight:600;color:#40506a;cursor:pointer}
  .pc-btn:hover{background:#f2f5f9;border-color:#c6cfdb}
  .pc-btn.danger:hover{background:#fdeced;border-color:#f2b8bd;color:#b02a37}
  .projempty{text-align:center;color:var(--muted);padding:70px 20px;font-size:14px;line-height:1.7}

  .hint-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
  .hint-empty .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px 26px;box-shadow:var(--shadow);text-align:center;color:var(--muted);max-width:340px}
  .hint-empty .card b{color:var(--ink)}
  .hint-empty .card button{pointer-events:auto;margin-top:12px}

  /* ---- Inspector ---- */
  .inspector{width:300px;background:#fff;border-left:1px solid var(--line);overflow-y:auto;flex-shrink:0}
  .insp-h{padding:12px 15px;border-bottom:1px solid var(--line);font-weight:650;display:flex;align-items:center;justify-content:space-between}
  .insp-b{padding:14px 15px;display:flex;flex-direction:column;gap:12px}
  .fld label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin-bottom:4px;font-weight:700}
  .fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);border-radius:7px;padding:7px 9px;background:#fff}
  .fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(31,95,168,.12)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .kindgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .kindchip{border:1px solid var(--line);border-radius:7px;padding:6px 8px;font-size:12px;font-weight:600;text-align:left;background:#fff;display:flex;align-items:center;gap:7px}
  .kindchip .sw{width:10px;height:10px;border-radius:3px}
  .kindchip.on{box-shadow:inset 0 0 0 2px var(--accent);background:#f4f8fe}
  .insp-tips{color:var(--muted);font-size:12.5px;line-height:1.6}
  .insp-tips b{color:var(--ink)}
  .insp-tips ul{margin:8px 0 0;padding-left:18px}
  .insp-tips li{margin-bottom:5px}
  /* interest controls + checks */
  .chk{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;font-weight:500;color:var(--ink);text-transform:none;letter-spacing:0;margin-top:9px;cursor:pointer}
  .chk input{width:15px;height:15px;margin-top:1px;flex-shrink:0}
  .fracin{margin-top:8px}
  .mut{color:var(--muted)}
  .ownsec{border-top:1px solid var(--line);padding-top:12px}
  .istat{font-size:12px;font-weight:600;padding:8px 10px;border-radius:8px;line-height:1.45;margin-top:10px}
  .istat.ok{background:#e7f6ec;color:#1c7a43}
  .istat.gap{background:#fdeced;color:#b02a37}
  .istat.over{background:#fff4dd;color:#8a5a00}
  .istat.origin{background:#eceafe;color:#5b3ad6}
  .istat.none{background:#f1f3f7;color:#6b7686}
  .icheck{border-radius:10px;padding:12px}
  .icheck.ok{background:#e7f6ec;border:1px solid #a9dcbc}
  .icheck.bad{background:#fdeced;border:1px solid #f2b8bd}
  .icheck h4{margin:0;font-size:12.5px;font-weight:700}
  .icheck.ok h4{color:#1c7a43}
  .icheck.bad h4{color:#b02a37}
  .iissue{display:block;width:100%;text-align:left;border:1px solid #f2b8bd;background:#fff;border-radius:7px;padding:7px 9px;margin-top:7px;font-size:12px;color:#7a2028;font-weight:600;cursor:pointer}
  .iissue:hover{background:#fff5f6}
  .iissue .who{color:#1f2733;font-weight:700}
  .ipill{position:absolute;top:12px;left:12px;z-index:5;font-size:12px;font-weight:700;padding:6px 12px;border-radius:20px;box-shadow:var(--shadow);cursor:pointer;user-select:none;display:none}
  .ipill.ok{background:#e7f6ec;color:#1c7a43;border:1px solid #a9dcbc}
  .ipill.bad{background:#fdeced;color:#b02a37;border:1px solid #f2b8bd}
  .del-row{margin-top:4px}
  .del-btn{width:100%;border:1px solid #f0c4c9;background:#fdeced;color:#b02a37;border-radius:8px;padding:8px;font-weight:650}
  .del-btn:hover{background:#fbdfe2}
  .arrow-info{background:#f6f8fb;border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:12.5px}
  .arrow-info .a{font-weight:650}
  .flip{width:100%;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px;font-weight:600}
  .flip:hover{background:#f2f5f9}
  .count-pill{font-size:11px;color:var(--muted);font-weight:600}

  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1f2733;color:#fff;padding:9px 16px;border-radius:8px;font-size:12.5px;box-shadow:var(--shadow);z-index:300;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
  /* in-app modal panel (used when the sandboxed web version blocks downloads/print) */
  .xoverlay{position:fixed;inset:0;background:rgba(18,26,40,.5);z-index:400;display:flex;align-items:center;justify-content:center;padding:20px}
  .xpanel{background:#fff;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.3);width:100%;max-width:560px;max-height:86vh;display:flex;flex-direction:column;overflow:hidden}
  .xhead{padding:13px 16px;border-bottom:1px solid var(--line);font-weight:650;display:flex;align-items:center;justify-content:space-between}
  .xclose{border:none;background:none;font-size:20px;color:var(--muted);line-height:1;cursor:pointer}
  .xbody{padding:14px 16px;overflow:auto}
  .xnote{margin:0 0 12px;font-size:13px;color:#43506a;line-height:1.55}
  .xnote b{color:var(--ink)}
  .xtext{width:100%;height:230px;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font:12px/1.5 ui-monospace,Consolas,monospace;resize:vertical;background:#f8fafc;color:#1f2733}
  .xfoot{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end}
  .xbtn{border:1px solid var(--line);background:#fff;color:#33445c;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer}
  .xbtn:hover{background:#f2f5f9}
  .xbtn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .xbtn.primary:hover{background:var(--accent-d)}

  /* ---- Google account / Drive ---- */
  .gwrap{display:flex;align-items:center;gap:8px}
  .gsign{display:inline-flex;align-items:center;gap:8px;background:#fff;color:#3c4043;border:1px solid #dadce0;
    border-radius:8px;padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer}
  .gsign:hover{background:#f7f8f8;box-shadow:0 1px 2px rgba(60,64,67,.3)}
  .gsign svg{width:15px;height:15px;flex-shrink:0}
  .gchip{display:inline-flex;align-items:center;gap:7px;background:rgba(255,255,255,.1);border:1px solid #3a4d68;
    border-radius:20px;padding:3px 4px 3px 10px;color:#dce6f4;font-size:12px;font-weight:600;cursor:pointer;max-width:230px}
  .gchip:hover{background:rgba(255,255,255,.17)}
  .gchip .em{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .gchip .av{width:22px;height:22px;border-radius:50%;background:#7fb3ec;color:#12233a;display:flex;align-items:center;
    justify-content:center;font-size:11px;font-weight:800;flex-shrink:0;overflow:hidden}
  .gchip .av img{width:100%;height:100%;object-fit:cover}
  .savestate{font-size:11.5px;color:#9fb2cc;white-space:nowrap;min-width:0}
  .savestate b{color:#dce6f4;font-weight:600}

  .flist{display:flex;flex-direction:column;gap:7px;max-height:44vh;overflow:auto;margin-top:4px}
  .frow{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:9px;padding:9px 11px;
    background:#fff;cursor:pointer;text-align:left;width:100%}
  .frow:hover{background:#f4f8fe;border-color:#bcd6f4}
  .frow .fi{width:26px;height:26px;border-radius:6px;background:#e8f0fb;color:var(--accent);display:flex;
    align-items:center;justify-content:center;font-weight:800;font-size:12px;flex-shrink:0}
  .frow .fn{flex:1;min-width:0}
  .frow .fn b{display:block;font-size:13px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .frow .fn span{font-size:11.5px;color:var(--muted)}
  .frow .fdel{border:none;background:none;color:#9aa6b6;font-size:15px;padding:2px 5px;border-radius:6px;cursor:pointer}
  .frow .fdel:hover{background:#fdeced;color:#b02a37}
  .fempty{color:var(--muted);text-align:center;padding:26px 8px;font-size:13px}
  .gsetup{font-size:12.5px;color:#43506a;line-height:1.6}
  .gsetup ol{margin:8px 0 0;padding-left:20px}
  .gsetup li{margin-bottom:7px}
  .gsetup code{background:#f1f3f7;border:1px solid #e2e7ef;border-radius:4px;padding:1px 5px;font-size:11.5px;
    font-family:ui-monospace,Consolas,monospace;word-break:break-all}
  .gwarn{background:#fff4dd;border:1px solid #f0dcae;color:#7a5200;border-radius:8px;padding:9px 11px;font-size:12.5px;line-height:1.5}
  .wherebox{background:#f6f8fb;border:1px solid var(--line);border-radius:9px;padding:10px 12px;
    font-size:12.5px;color:#43506a;line-height:1.6;margin-top:4px}
  .wherebox > b{color:var(--ink)}
  .wherebox .path{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--accent-d);
    background:#fff;border:1px solid #e2e7ef;border-radius:6px;padding:6px 8px;margin:6px 0;word-break:break-word}
  .wherebtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .wherebtns .xbtn{flex:1;min-width:150px;text-align:center}
  .savegrid{display:flex;flex-direction:column;gap:9px}
  .savebtn{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;
    border:1px solid var(--line);background:#fff;border-radius:9px;padding:11px 13px;cursor:pointer}
  .savebtn:hover{background:#f4f8fe;border-color:#bcd6f4}
  .savebtn b{font-size:14px;color:var(--accent-d)}
  .savebtn span{font-size:12px;color:var(--muted)}

  /* ---- PDF / print view (built off-screen, revealed only when printing) ---- */
  .print-root{position:fixed;left:-100000px;top:0;background:#fff;color:#111}
  .print-page{width:720px;padding:0 0 18px}
  .print-head{padding:2px 0 12px;border-bottom:2px solid #22344b;margin-bottom:16px}
  .print-head .pt{font-size:18px;font-weight:700;color:#1a2739}
  .print-head .ps{font-size:12px;color:#556;margin-top:3px}
  .print-stage{position:relative;overflow:hidden}
  .print-world{position:relative;transform-origin:0 0}
  .print-world .box{cursor:default}

  @media print{
    @page{size:letter;margin:0.5in}
    html,body{overflow:visible;background:#fff}
    .app-grid{display:none!important}
    .print-root{position:static;left:auto;top:auto}
    .print-page{break-after:page;page-break-after:always}
    .print-page:last-child{break-after:auto;page-break-after:auto}
    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .box{box-shadow:none!important}
    .box .handle{display:none!important}
  }
</style>
</head>
<body>
<div class="app-grid">
  <header class="app">
    <span class="brand"><span class="mark">§</span> Title Chain Canvas</span>
    <input class="proj-name" id="projName" placeholder="Project name" oninput="setProj(this.value)">
    <span class="savestate" id="saveState"></span>
    <span class="spacer"></span>
    <div class="tbtns">
      <button class="btn" onclick="openProjectsPage()">Projects</button>
      <button class="btn ghost" onclick="loadSample()">Sample</button>
      <button class="btn ghost" onclick="importJSON()">Import</button>
      <button class="btn ghost" onclick="exportJSON()">Export</button>
      <button class="btn" onclick="openSaveDialog()">Save PDF / Image</button>
      <button class="btn ghost" onclick="openPrintDialog()">Print</button>
      <button class="btn ghost" onclick="newProject()">New</button>
    </div>
    <div class="gwrap" id="gwrap"></div>
  </header>

  <div class="toolbar">
    <div class="parcels" id="parcels"></div>
    <div class="tools">
      <select class="newkind" id="newKind" title="Type of box to add">
        <option value="deed">Deed</option>
        <option value="mortgage">Mortgage</option>
        <option value="assignment">Assignment</option>
        <option value="release">Release</option>
        <option value="lien">Lien / Judgment</option>
        <option value="easement">Easement</option>
        <option value="lease">Lease</option>
        <option value="probate">Probate / Will</option>
        <option value="affidavit">Affidavit</option>
        <option value="patent">Patent / Origin</option>
        <option value="misc">Misc</option>
        <option value="note">Note</option>
      </select>
      <button class="tool primary" onclick="addBox()">+ Add box</button>
      <button class="tool" id="btnUndo" onclick="undo()" title="Undo (Ctrl+Z)" aria-label="Undo">&#8630;</button>
      <button class="tool" id="btnRedo" onclick="redo()" title="Redo (Ctrl+Y)" aria-label="Redo">&#8631;</button>
      <button class="tool" onclick="fitAll()">Fit</button>
      <div class="zoom">
        <button onclick="zoomBy(1/1.2)">−</button>
        <span id="zoomPct">100%</span>
        <button onclick="zoomBy(1.2)">+</button>
      </div>
    </div>
  </div>

  <div class="stage">
    <div class="canvas" id="canvas">
      <div class="ipill" id="ipill" onclick="focusFirstIssue()" title="Interest accounting for this parcel"></div>
      <div id="world">
        <svg id="arrows"></svg>
      </div>
      <div class="hint-empty" id="hintEmpty" style="display:none">
        <div class="card">
          <b>Empty parcel.</b><br>Add a box for the current deed, then drag from the little dot at its bottom to another box to draw a conveyance arrow.
          <br><button class="tool primary" onclick="addBox()">+ Add first box</button>
        </div>
      </div>
    </div>
    <aside class="inspector">
      <div class="insp-h"><span id="inspTitle">Details</span><span class="count-pill" id="inspCount"></span></div>
      <div class="insp-b" id="inspBody"></div>
    </aside>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ================= Config ================= */
const STORE_KEY='titleCanvas.v2';
const KINDS={
  deed:{label:'Deed',c:'#1f5fa8',bg:'#e8f0fb',bd:'#cfe0f6'},
  mortgage:{label:'Mortgage',c:'#8a5a00',bg:'#fff4dd',bd:'#f0dcae'},
  assignment:{label:'Assignment',c:'#a21caf',bg:'#fbeafc',bd:'#f0c8f4'},
  release:{label:'Release',c:'#1c7a43',bg:'#e7f6ec',bd:'#a9dcbc'},
  lien:{label:'Lien / Judgment',c:'#b02a37',bg:'#fdeced',bd:'#f2b8bd'},
  easement:{label:'Easement',c:'#0f766e',bg:'#e0f2f0',bd:'#a7dad4'},
  lease:{label:'Lease',c:'#b45309',bg:'#fdf0e1',bd:'#f2d6ac'},
  probate:{label:'Probate / Will',c:'#6d28d9',bg:'#f1eafe',bd:'#ddccfb'},
  affidavit:{label:'Affidavit',c:'#4d7c0f',bg:'#eef6e1',bd:'#cfe6a8'},
  patent:{label:'Patent / Origin',c:'#3730a3',bg:'#e8e9fb',bd:'#c9cbf3'},
  misc:{label:'Misc',c:'#64748b',bg:'#eef1f6',bd:'#d6dde7'},
  note:{label:'Note',c:'#556070',bg:'#f1f3f7',bd:'#dde3ec'}
};
const PARCEL_COLORS=['#1f5fa8','#0f766e','#8a5a00','#6d28d9','#b02a37','#0e7490','#9333ea','#15803d'];

/* ================= State ================= */
let state=blankState();
let activeId=null;
let selType=null, selId=null;
let drag=null;
let zTop=10;

function blankState(){
  const p=newParcel('Parcel 1');
  const s={id:uid(), project:'Untitled Search', parcels:[p]};
  return s;
}
function newParcel(name){
  return {id:uid(),name:name||'Parcel',color:PARCEL_COLORS[0],
    boxes:[],arrows:[],view:{panX:80,panY:80,zoom:1}};
}
function uid(){return 'x'+Math.random().toString(36).slice(2,9)}
function activeParcel(){return state.parcels.find(p=>p.id===activeId)||state.parcels[0]}
function view(){return activeParcel().view}
function boxById(id){return activeParcel().boxes.find(b=>b.id===id)}
function boxEl(id){return document.querySelector('.box[data-id="'+id+'"]')}

/* ================= Interest accounting ================= */
const OWNERSHIP=new Set(['deed','probate','patent']); // kinds that carry fee interest — these drive the gap check
// Kinds that can record a fraction. Leases and assignments are often partial (half a
// mortgage, a fractional mineral lease) but convey no fee title, so their fraction is
// noted for reference and deliberately kept out of the chain's interest math.
const FRACTIONAL=new Set(['deed','probate','patent','lease','assignment']);
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a||1}
function reduce(n,d){if(d<0){n=-n;d=-d}const g=gcd(n,d);return{n:n/g,d:d/g}}
function parseFrac(s){
  if(s==null)return{n:1,d:1};s=(''+s).trim();if(!s)return{n:1,d:1};
  if(s.includes('/')){const[a,b]=s.split('/');const n=parseFloat(a),d=parseFloat(b);
    if(!isFinite(n)||!isFinite(d)||!d)return{n:0,d:1};return reduce(n,d);}
  const v=parseFloat(s);if(!isFinite(v))return{n:0,d:1};
  if(Number.isInteger(v))return{n:v,d:1};return reduce(Math.round(v*10000),10000);
}
function addFrac(a,b){return reduce(a.n*b.d+b.n*a.d,a.d*b.d)}
function subFrac(a,b){return reduce(a.n*b.d-b.n*a.d,a.d*b.d)}
function eqFrac(a,b){return a.n*b.d===b.n*a.d}
function ltFrac(a,b){return a.n*b.d<b.n*a.d}
function fracStr(f){return f.d===1?''+f.n:f.n+'/'+f.d}
const WHOLE={n:1,d:1};
function isOrigin(b){return !!b.origin||b.kind==='patent'}
function interestOf(b){return parseFrac(b&&b.partial?(b.interest||'1/1'):'1/1')}
// Status of a single ownership box: is the interest it conveys backed by incoming prior deeds?
function interestStatus(b,parcel){
  parcel=parcel||activeParcel();
  if(!OWNERSHIP.has(b.kind))return null;
  const connected=parcel.arrows.some(a=>a.from===b.id||a.to===b.id);
  if(!b.grantor&&!b.grantee&&!connected)return null; // ignore blank scratch boxes
  if(isOrigin(b))return{state:'origin'};
  const req=interestOf(b);
  const sources=parcel.arrows.filter(a=>a.to===b.id)
    .map(a=>parcel.boxes.find(x=>x.id===a.from))
    .filter(x=>x&&OWNERSHIP.has(x.kind));
  if(!sources.length)return{state:'unsourced',req};
  let sum={n:0,d:1};sources.forEach(s=>sum=addFrac(sum,interestOf(s)));
  if(eqFrac(sum,req))return{state:'ok',req,sourced:sum};
  if(ltFrac(sum,req))return{state:'missing',req,sourced:sum,gap:subFrac(req,sum)};
  return{state:'over',req,sourced:sum,gap:subFrac(sum,req)};
}
function parcelIssues(parcel){
  parcel=parcel||activeParcel();const out=[];
  parcel.boxes.forEach(b=>{const s=interestStatus(b,parcel);
    if(s&&(s.state==='missing'||s.state==='over'||s.state==='unsourced'))out.push({b,s});});
  return out;
}
function statClass(st){if(!st)return'none';return st.state==='ok'?'ok':st.state==='origin'?'origin':st.state==='over'?'over':'gap'}
function statLine(st){
  if(!st)return'No interest tracking for this instrument type.';
  switch(st.state){
    case'origin':return'◆ Origin of title — the chain terminates here, no prior deed required.';
    case'ok':return'✓ Interest fully accounted'+(st.req&&!eqFrac(st.req,WHOLE)?' ('+fracStr(st.req)+' conveyed, all sourced).':' — full title sourced by prior deeds.');
    case'missing':return'⚠ Missing '+fracStr(st.gap)+'. Prior deeds convey '+fracStr(st.sourced)+' of the '+fracStr(st.req)+' needed.';
    case'unsourced':return'⚠ No prior deed found. Draw an arrow from the conveyance that vested title in this grantor, or mark this box as origin/patent.';
    case'over':return'⚠ Over-conveyed by '+fracStr(st.gap)+'. Prior deeds total '+fracStr(st.sourced)+' but only '+fracStr(st.req)+' is needed.';
  }
}
function statChip(st){
  if(!st)return'';
  const map={origin:['origin','◆ Origin of title'],ok:['ok','✓ Interest sourced'],
    missing:['gap','⚠ Missing '+ (st.gap?fracStr(st.gap):'')],
    unsourced:['gap','⚠ No prior deed'],over:['over','⚠ Over '+(st.gap?fracStr(st.gap):'')]};
  const m=map[st.state];return m?`<span class="schip ${m[0]}">${m[1]}</span>`:'';
}
function updatePill(){
  const pill=document.getElementById('ipill');if(!pill)return;
  const owns=activeParcel().boxes.some(b=>interestStatus(b));
  if(!owns){pill.style.display='none';return;}
  const issues=parcelIssues();
  pill.style.display='inline-block';
  if(issues.length){pill.className='ipill bad';pill.textContent=`⚠ ${issues.length} interest gap${issues.length!==1?'s':''}`;}
  else{pill.className='ipill ok';pill.textContent='✓ Interest balanced';}
}
function focusFirstIssue(){const is=parcelIssues();if(is.length){select('box',is[0].b.id);centerOnBox(is[0].b.id);}}
function centerOnBox(id){
  const b=boxById(id);if(!b)return;
  const apply=()=>{
    const el=boxEl(id),v=view(),r=canvas.getBoundingClientRect();
    // fall back if the canvas has not been measured yet — a zero-size read would
    // otherwise park the box off-screen, which is exactly what centring prevents
    const cw=r.width||canvas.clientWidth||window.innerWidth;
    const ch=r.height||canvas.clientHeight||window.innerHeight;
    const w=el?el.offsetWidth:222,h=el?el.offsetHeight:110;
    v.panX=cw/2-(b.x+w/2)*v.zoom;v.panY=ch/2-(b.y+h/2)*v.zoom;
    applyView();save();
  };
  apply();
  if(!canvas.getBoundingClientRect().width)requestAnimationFrame(apply);
}

/* ================= Persistence ================= */
/* Workspaces are scoped per signed-in person, so shared computers never show
   one examiner's canvas to the next. Signed out = a separate "guest" workspace. */
let ctxKey='::guest';
function storeKey(){return STORE_KEY+ctxKey}
function ctxFor(email){return '::'+String(email||'').toLowerCase().trim()}
function save(){try{localStorage.setItem(storeKey(),JSON.stringify({state,activeId,curFile}))}catch(e){}
  if(typeof markCloudDirty==='function')markCloudDirty();
  if(typeof libTouch==='function')libTouch();}
function loadRaw(raw){
  try{const o=JSON.parse(raw);
    if(o.state&&o.state.parcels){
      state=o.state;activeId=o.activeId||state.parcels[0].id;
      curFile=o.curFile&&o.curFile.id?o.curFile:{id:null,name:null};
      return true;}
  }catch(e){}
  return false;
}
function load(){const raw=localStorage.getItem(storeKey());return raw?loadRaw(raw):false}
// One-time move of work saved before workspaces became per-person.
function migrateLegacyStore(){
  try{const legacy=localStorage.getItem(STORE_KEY);
    if(legacy&&!localStorage.getItem(STORE_KEY+'::guest')){
      localStorage.setItem(STORE_KEY+'::guest',legacy);localStorage.removeItem(STORE_KEY);return true;}
  }catch(_){}
  return false;
}
function canvasHasWork(){return state.parcels.some(p=>p.boxes&&p.boxes.length)}
function blankCanvas(){
  state=blankState();activeId=state.parcels[0].id;selType=null;selId=null;
  curFile={id:null,name:null};cloudDirty=false;
}
// Move into a person's own workspace after they sign in (or back to guest on sign-out).
function adoptContext(want){
  if(ctxKey===want)return;
  save();                                  // flush current canvas under the old owner's key
  const hadWork=canvasHasWork();
  ctxKey=want;
  const raw=localStorage.getItem(storeKey());
  if(raw&&loadRaw(raw)){cloudDirty=false;render();histReset();updateSaveState();return}
  if(hadWork){askKeepOrFresh();return}      // first sign-in with something on screen
  blankCanvas();render();histReset();updateSaveState();
}
function askKeepOrFresh(){
  showModalPanel({title:'Start fresh or keep this work?',
    bodyHTML:`<p class="xnote">There's a project open that wasn't saved under your account.</p>
      <p class="xnote">On a shared computer this is usually someone else's work — start fresh unless you know it's yours.</p>`,
    buttons:[{label:'Start fresh',primary:true,onClick:()=>{closeModalPanel();blankCanvas();render();histReset();updateSaveState()}},
             {label:'Keep it as mine',onClick:()=>{closeModalPanel();cloudDirty=true;render();updateSaveState();toast('Kept — use Save to Drive to store it')}}]});
}

/* ================= Coord helpers ================= */
const canvas=document.getElementById('canvas');
const world=document.getElementById('world');
const svg=document.getElementById('arrows');
function worldFromEvent(e){
  const r=canvas.getBoundingClientRect(),v=view();
  return {x:(e.clientX-r.left-v.panX)/v.zoom, y:(e.clientY-r.top-v.panY)/v.zoom};
}
function applyView(){
  const v=view();
  world.style.transform=`translate(${v.panX}px,${v.panY}px) scale(${v.zoom})`;
  canvas.style.backgroundSize=`${24*v.zoom}px ${24*v.zoom}px`;
  canvas.style.backgroundPosition=`${v.panX}px ${v.panY}px`;
  document.getElementById('zoomPct').textContent=Math.round(v.zoom*100)+'%';
}

/* ================= Render ================= */
function render(){
  renderParcels();
  renderBoxes();
  drawArrows();
  applyView();
  renderInspector();
  updatePill();
  document.getElementById('projName').value=state.project;
  document.getElementById('hintEmpty').style.display=activeParcel().boxes.length?'none':'flex';
  save();
}
function renderParcels(){
  const el=document.getElementById('parcels');
  el.innerHTML=state.parcels.map(p=>{
    const on=p.id===activeId?'active':'';
    return `<div class="ptab ${on}" onclick="selectParcel('${p.id}')" ondblclick="renameParcel('${p.id}')" title="Double-click to rename">
      <span class="swatch" style="background:${p.color}"></span>${esc(p.name)}
      ${state.parcels.length>1?`<button class="close" onclick="event.stopPropagation();deleteParcel('${p.id}')">×</button>`:''}
    </div>`;
  }).join('')+`<button class="ptab addp" onclick="addParcel()">+ Parcel</button>`;
}
function renderBoxes(){
  [...world.querySelectorAll('.box')].forEach(n=>n.remove());
  activeParcel().boxes.forEach(b=>{
    const el=document.createElement('div');
    el.className='box'+(selType==='box'&&selId===b.id?' sel':'');
    el.dataset.id=b.id;
    el.style.left=b.x+'px';el.style.top=b.y+'px';
    styleBox(el,b);
    el.innerHTML=boxInner(b);
    world.appendChild(el);
  });
}
function styleBox(el,b,parcel){
  const k=KINDS[b.kind]||KINDS.deed;
  el.style.borderTopColor=k.c;
  const st=interestStatus(b,parcel);
  el.classList.remove('bgap','bover');
  if(st&&(st.state==='missing'||st.state==='unsourced'))el.classList.add('bgap');
  else if(st&&st.state==='over')el.classList.add('bover');
}
function boxInner(b,parcel){
  const k=KINDS[b.kind]||KINDS.deed;
  const grantor=b.grantor?esc(b.grantor):'<span class="ph">Grantor…</span>';
  const grantee=b.grantee?esc(b.grantee):'<span class="ph">Grantee…</span>';
  const rows=[];
  if(b.idate) rows.push(row('Inst',b.idate));
  if(b.rdate) rows.push(row('Rec',b.rdate));
  if(b.docnum) rows.push(row('Doc#',b.docnum));
  if(b.bookpage) rows.push(row('Bk/Pg',b.bookpage));
  if(b.notes) rows.push(row('Note',b.notes));
  const meta=rows.length?`<div class="meta">${rows.join('')}</div>`:'';
  const partyBlock = b.kind==='note'
    ? `<div class="party">${b.notes?esc(b.notes):'<span class="ph">Note…</span>'}</div>`
    : `<div class="party">${grantor}</div><div class="to">▼ conveys to</div><div class="party grantee">${grantee}</div>`;
  const metaOut = b.kind==='note'?'':meta;
  const intBadge=(b.partial&&FRACTIONAL.has(b.kind))?`<span class="ibadge">${esc(fracStr(interestOf(b)))} interest</span>`:'';
  const chip=statChip(interestStatus(b,parcel));
  return `<button class="bmenu" title="Duplicate or delete" aria-label="Box actions">&#8943;</button>
    <span class="kind" style="background:${k.bg};color:${k.c}">${k.label}</span>${intBadge}
    ${partyBlock}${metaOut}${chip}
    <div class="handle" title="Drag to the deed this one conveys into"></div>`;
}
function row(lab,val){return `<div class="row"><span class="lab">${lab}</span><span>${esc(val)}</span></div>`}
function refreshBox(id){
  const el=boxEl(id),b=boxById(id);if(!el||!b)return;
  el.innerHTML=boxInner(b);styleBox(el,b);
}
function positionBox(el,b){el.style.left=b.x+'px';el.style.top=b.y+'px'}

/* ================= Arrows ================= */
function rectOf(id){
  const el=boxEl(id),b=boxById(id);if(!el||!b)return null;
  return {x:b.x,y:b.y,w:el.offsetWidth,h:el.offsetHeight};
}
function edgePoint(r,to){
  const cx=r.x+r.w/2,cy=r.y+r.h/2;let dx=to.x-cx,dy=to.y-cy;
  if(!dx&&!dy)return{x:cx,y:cy};
  const sx=dx?(r.w/2)/Math.abs(dx):1e9, sy=dy?(r.h/2)/Math.abs(dy):1e9;
  const s=Math.min(sx,sy);return{x:cx+dx*s,y:cy+dy*s};
}
function drawArrows(){
  const p=activeParcel();
  const parts=[`<defs>
    <marker id="ah" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#4a5a72"/></marker>
    <marker id="ahs" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L10,4 L0,8 Z" fill="#1f5fa8"/></marker>
  </defs>`];
  p.arrows.forEach(a=>{
    const A=rectOf(a.from),B=rectOf(a.to);if(!A||!B)return;
    const cA={x:A.x+A.w/2,y:A.y+A.h/2},cB={x:B.x+B.w/2,y:B.y+B.h/2};
    const s=edgePoint(A,cB),t=edgePoint(B,cA);
    const sel=selType==='arrow'&&selId===a.id;
    parts.push(`<path data-arrow="${a.id}" d="M${s.x},${s.y} L${t.x},${t.y}" stroke="transparent" stroke-width="16" fill="none" pointer-events="stroke" style="cursor:pointer"/>`);
    parts.push(`<path d="M${s.x},${s.y} L${t.x},${t.y}" stroke="${sel?'#1f5fa8':'#4a5a72'}" stroke-width="${sel?2.6:1.8}" fill="none" marker-end="url(#${sel?'ahs':'ah'})" pointer-events="none"/>`);
  });
  if(drag&&drag.mode==='arrow'&&drag.tempWorld){
    const A=rectOf(drag.fromId);
    if(A){const s=edgePoint(A,drag.tempWorld);
      parts.push(`<path d="M${s.x},${s.y} L${drag.tempWorld.x},${drag.tempWorld.y}" stroke="#1f5fa8" stroke-width="1.9" stroke-dasharray="6 4" fill="none" marker-end="url(#ahs)" pointer-events="none"/>`);}
  }
  svg.innerHTML=parts.join('');
}

/* ================= Selection & inspector ================= */
function select(type,id){selType=type;selId=id;renderBoxes();drawArrows();renderInspector()}
function clearSelection(){if(selType){selType=null;selId=null;renderBoxes();drawArrows();renderInspector()}}
function renderInspector(){
  const title=document.getElementById('inspTitle');
  const cnt=document.getElementById('inspCount');
  const body=document.getElementById('inspBody');
  const p=activeParcel();
  cnt.textContent=`${p.boxes.length} box · ${p.arrows.length} link`;
  if(selType==='box'){
    const b=boxById(selId);if(!b){clearSelection();return;}
    title.textContent='Edit box';
    body.innerHTML=`
      <div class="fld"><label>Type</label>
        <div class="kindgrid">${Object.keys(KINDS).map(k=>`

/* ================= Project library =================
   Every project you touch is kept here, per workspace, so the Projects page is
   useful with or without Drive. Drive stays the source of truth once connected —
   these entries carry the Drive id so the two line up. --------------------------- */
const LIB_KEY='titleCanvas.lib';
function libKey(){return LIB_KEY+ctxKey}
function libLoad(){try{return JSON.parse(localStorage.getItem(libKey())||'{}')||{}}catch(_){return{}}}
function libWrite(lib){
  try{localStorage.setItem(libKey(),JSON.stringify(lib));return true}
  catch(_){                        // out of space — drop the oldest until it fits
    const ids=Object.keys(lib).sort((a,b)=>(lib[a].updated||0)-(lib[b].updated||0));
    while(ids.length>1){
      delete lib[ids.shift()];
      try{localStorage.setItem(libKey(),JSON.stringify(lib));return true}catch(__){}
    }
    return false;
  }
}
function libStats(s){
  let boxes=0;(s.parcels||[]).forEach(p=>{boxes+=(p.boxes||[]).length});
  return{parcels:(s.parcels||[]).length,boxes};
}
let libTimer=null;
function libTouch(){                // debounced: save() runs on every render
  clearTimeout(libTimer);
  libTimer=setTimeout(()=>{
    if(!state.id)state.id=uid();
    const st=libStats(state);
    if(!st.boxes&&(state.project||'')==='Untitled Search')return;   // ignore empty scratch
    const lib=libLoad();
    lib[state.id]={name:state.project||'Untitled Search',updated:Date.now(),
      parcels:st.parcels,boxes:st.boxes,driveId:curFile.id||null,data:JSON.stringify(state)};
    libWrite(lib);
  },900);
}
function libFlush(){clearTimeout(libTimer);libTimer=null;
  if(!state.id)state.id=uid();
  const st=libStats(state);
  if(!st.boxes&&(state.project||'')==='Untitled Search')return;
  const lib=libLoad();
  lib[state.id]={name:state.project||'Untitled Search',updated:Date.now(),
    parcels:st.parcels,boxes:st.boxes,driveId:curFile.id||null,data:JSON.stringify(state)};
  libWrite(lib);
}
function relTime(ms){
  if(!ms)return'';
  const d=Date.now()-ms,m=Math.round(d/60000);
  if(m<1)return'just now';
  if(m<60)return m+' min ago';
  const h=Math.round(m/60);if(h<24)return h+(h===1?' hour ago':' hours ago');
  const dy=Math.round(h/24);if(dy<7)return dy+(dy===1?' day ago':' days ago');
  return new Date(ms).toLocaleDateString();
}

/* ================= Undo / redo =================
   Snapshot-based: each committed change stores the whole project. Typing in one
   field collapses into a single step, and the camera (pan/zoom) is left alone so
   undo never yanks the view out from under you. ---------------------------------- */
const HIST_MAX=60;
let hist=[],histIdx=-1,histLast={key:'',t:0},histLock=false;
function histSnap(){return JSON.stringify({state,activeId})}
function histReset(){hist=[histSnap()];histIdx=0;histLast={key:'',t:0};updateHistButtons()}
function commit(key){
  if(histLock)return;
  const now=Date.now(),s=histSnap();
  if(key&&key===histLast.key&&now-histLast.t<900&&histIdx>=0){
    hist[histIdx]=s;histLast.t=now;updateHistButtons();return;   // coalesce a typing burst
  }
  histLast={key:key||'',t:now};
  hist=hist.slice(0,histIdx+1);
  hist.push(s);
  if(hist.length>HIST_MAX)hist.shift();
  histIdx=hist.length-1;
  updateHistButtons();
}
function histApply(){
  let o;try{o=JSON.parse(hist[histIdx])}catch(_){return}
  const views={};state.parcels.forEach(p=>views[p.id]=p.view);
  state=o.state;
  state.parcels.forEach(p=>{if(views[p.id])p.view=views[p.id]});
  activeId=state.parcels.some(p=>p.id===o.activeId)?o.activeId:state.parcels[0].id;
  // stay on whatever was selected if it still exists, so undoing a text edit
  // doesn't close the inspector out from under you
  const kType=selType,kId=selId;const ap=activeParcel();
  selType=null;selId=null;
  if(kType==='box'&&ap.boxes.some(b=>b.id===kId)){selType='box';selId=kId}
  else if(kType==='arrow'&&ap.arrows.some(a=>a.id===kId)){selType='arrow';selId=kId}
  histLast={key:'',t:0};
  histLock=true;render();histLock=false;
  updateHistButtons();
}
function undo(){if(histIdx>0){histIdx--;histApply();toast('Undo')}else{toast('Nothing to undo')}}
function redo(){if(histIdx<hist.length-1){histIdx++;histApply();toast('Redo')}else{toast('Nothing to redo')}}
function updateHistButtons(){
  const u=document.getElementById('btnUndo'),r=document.getElementById('btnRedo');
  if(u)u.disabled=histIdx<=0;
  if(r)r.disabled=histIdx>=hist.length-1;
}

/* ================= Mutations ================= */
function addBox(){
  const r=canvas.getBoundingClientRect(),v=view();
  const cx=(r.width/2-v.panX)/v.zoom,cy=(r.height/2-v.panY)/v.zoom;
  const jitter=()=>Math.round((Math.random()-.5)*40);
  const b={id:uid(),kind:document.getElementById('newKind').value,
    x:Math.round(cx-111)+jitter(),y:Math.round(cy-45)+jitter(),
    grantor:'',grantee:'',idate:'',rdate:'',docnum:'',bookpage:'',notes:'',partial:false,interest:'1/1',origin:false};
  activeParcel().boxes.push(b);
  render();select('box',b.id);commit();
  document.getElementById('hintEmpty').style.display='none';
  setTimeout(()=>{const f=document.getElementById('f_grantor');if(f)f.focus()},30);
}
// Copy a box's contents to a new box. Arrows are intentionally NOT copied — the
// duplicate is a fresh instrument that still needs its own place in the chain.
function duplicateBox(id){
  const p=activeParcel();
  const src=p.boxes.find(b=>b.id===id);
  if(!src)return;
  const copy=Object.assign({},src,{id:uid(),x:src.x+30,y:src.y+30});
  p.boxes.push(copy);
  render();select('box',copy.id);commit();
  toast('Duplicated');
  setTimeout(()=>{const f=document.getElementById('f_grantor');if(f){f.focus();f.select()}},40);
}
// Every box that feeds INTO `id`, transitively — i.e. that instrument's prior chain.
// Arrows run prior-deed → later-deed, so walking `a.to===cur` climbs backwards in time.
function ancestorsOf(id,parcel){
  const p=parcel||activeParcel();
  const seen=new Set([id]),stack=[id];
  while(stack.length){
    const cur=stack.pop();
    p.arrows.forEach(a=>{if(a.to===cur&&!seen.has(a.from)){seen.add(a.from);stack.push(a.from)}});
  }
  return [...seen];
}
function nextParcelName(){return 'Parcel '+(state.parcels.length+1)}
// Name a spun-off parcel after the owner it starts with — the grantee of the deed
// it was started from — rather than a bare "Parcel 3".
function parcelNameFrom(b){
  let base=((b&&(b.grantee||b.grantor))||'').trim().replace(/\s+/g,' ');
  if(!base)return uniqueParcelName(nextParcelName());
  if(base.length>30)base=base.slice(0,29).replace(/[\s,;&\-/]+$/,'')+'…';
  return uniqueParcelName(base);
}
function uniqueParcelName(base){
  const taken=new Set(state.parcels.map(p=>(p.name||'').toLowerCase()));
  if(!taken.has(base.toLowerCase()))return base;
  let i=2;while(taken.has((base+' ('+i+')').toLowerCase()))i++;
  return base+' ('+i+')';
}
// One click: open a new parcel that already carries this instrument and everything
// behind it, for a tract that splits off and shares the earlier history.
function startNewChainFrom(id){copyToParcel(id,'chain','__new__')}
function openCopyToParcel(id){
  const src=activeParcel();
  const chain=ancestorsOf(id,src);
  const others=state.parcels.filter(p=>p.id!==src.id);
  showModalPanel({title:'Copy to another parcel',
    bodyHTML:`<p class="xnote">Use this when a parcel splits off and shares the earlier history &mdash; the copied deeds keep the arrows between them.</p>
      <div class="fld"><label>What to copy</label><select id="cp_scope">
        <option value="chain"${chain.length>1?' selected':''}>This box and its prior chain &mdash; ${chain.length} instrument${chain.length!==1?'s':''}</option>
        <option value="one"${chain.length>1?'':' selected'}>Just this box</option>
      </select></div>
      <div class="fld" style="margin-top:10px"><label>Copy into</label><select id="cp_dest">
        <option value="__new__">&#43; New parcel</option>
        ${others.map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('')}
      </select></div>
      <p class="xnote" style="margin-top:10px">The originals stay where they are. You'll be switched to the destination parcel.</p>`,
    buttons:[{label:'Copy',primary:true,onClick:()=>{
        const scope=document.getElementById('cp_scope').value;
        const dest=document.getElementById('cp_dest').value;
        closeModalPanel();copyToParcel(id,scope,dest);
      }},{label:'Cancel',onClick:closeModalPanel}]});
}
function copyToParcel(rootId,scope,destId){
  const src=activeParcel();
  const ids=scope==='chain'?ancestorsOf(rootId,src):[rootId];
  let dest;
  if(destId==='__new__'){
    dest=newParcel(parcelNameFrom(src.boxes.find(x=>x.id===rootId)));
    dest.color=PARCEL_COLORS[state.parcels.length%PARCEL_COLORS.length];
    state.parcels.push(dest);
  }else dest=state.parcels.find(p=>p.id===destId);
  if(!dest){toast('Pick a destination');return}
  // shift the copies clear of anything already on the destination canvas
  let dx=0;
  if(dest.boxes.length){
    let dmaxX=-1e9;dest.boxes.forEach(b=>{dmaxX=Math.max(dmaxX,b.x+240)});
    let sminX=1e9;ids.forEach(i=>{const b=src.boxes.find(x=>x.id===i);if(b)sminX=Math.min(sminX,b.x)});
    dx=Math.round(dmaxX+70-sminX);
  }
  const map={};
  ids.forEach(i=>{
    const b=src.boxes.find(x=>x.id===i);if(!b)return;
    const nb=Object.assign({},b,{id:uid(),x:b.x+dx});
    map[i]=nb.id;dest.boxes.push(nb);
  });
  let links=0;
  src.arrows.forEach(a=>{if(map[a.from]&&map[a.to]){dest.arrows.push({id:uid(),from:map[a.from],to:map[a.to]});links++}});
  const n=Object.keys(map).length;
  activeId=dest.id;selType=null;selId=null;
  render();
  // land on the copy you acted on, centred and selected, so it can't get lost
  const landed=map[rootId];
  if(landed){select('box',landed);centerOnBox(landed);}
  else fitAll();
  commit();
  toast(n+' box'+(n!==1?'es':'')+(links?' and '+links+' link'+(links!==1?'s':''):'')+' copied to '+dest.name);
}

/* ================= View: zoom / fit ================= */
function zoomBy(f){
  const v=view(),r=canvas.getBoundingClientRect();
  const mx=r.width/2,my=r.height/2;
  const wx=(mx-v.panX)/v.zoom,wy=(my-v.panY)/v.zoom;
  v.zoom=Math.min(3,Math.max(.2,v.zoom*f));
  v.panX=mx-wx*v.zoom;v.panY=my-wy*v.zoom;applyView();save();
}
function fitAll(){
  const p=activeParcel();if(!p.boxes.length)return;
  let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
  p.boxes.forEach(b=>{const el=boxEl(b.id);const w=el?el.offsetWidth:222,h=el?el.offsetHeight:110;
    minX=Math.min(minX,b.x);minY=Math.min(minY,b.y);maxX=Math.max(maxX,b.x+w);maxY=Math.max(maxY,b.y+h);});
  const pad=60,r=canvas.getBoundingClientRect();
  const bw=maxX-minX+pad*2,bh=maxY-minY+pad*2;
  const v=view();
  v.zoom=Math.min(1.1,Math.min(r.width/bw,r.height/bh));
  v.panX=(r.width-(maxX+minX)*v.zoom)/2;
  v.panY=(r.height-(maxY+minY)*v.zoom)/2;
  applyView();save();
}

/* ================= Pointer interaction (mouse + touch + stylus) ================= */
const pointers=new Map();   // active pointers: id -> {x,y}
let pinch=null;             // two-finger zoom/pan session
canvas.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'&&e.button!==0)return;
  if(e.pointerType==='mouse')pointers.clear();   // guard against a missed pointerup
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  try{canvas.setPointerCapture(e.pointerId)}catch(_){}
  if(pointers.size===2){          // second finger down → pinch/pan, abandon any single drag
    if(drag&&drag.mode==='arrow'){drag=null;drawArrows()}
    drag=null;document.body.style.userSelect='';canvas.classList.remove('panning');
    startPinch();return;
  }
  if(pointers.size>2)return;
  const handle=e.target.closest('.handle');
  const bx=e.target.closest('.box');
  const arrow=e.target.closest('[data-arrow]');
  const mbtn=e.target.closest('.bmenu');
  if(mbtn&&bx){                    // ⋯ toggles its menu and must never start a drag
    e.preventDefault();e.stopPropagation();
    const already=boxMenuOpenFor()===bx.dataset.id;
    closeBoxMenu();
    if(!already){
      const r=mbtn.getBoundingClientRect();   // capture before the re-render below
      select('box',bx.dataset.id);
      openBoxMenu(bx.dataset.id,r);
    }
    return;
  }
  closeBoxMenu();
  if(handle&&bx){startArrow(bx.dataset.id,e);return;}
  if(bx){startBoxDrag(bx,e);return;}
  if(arrow){select('arrow',arrow.dataset.arrow);e.preventDefault();return;}
  clearSelection();startPan(e);
});
function startBoxDrag(el,e){
  const id=el.dataset.id;select('box',id);
  el.style.zIndex=++zTop;
  const w=worldFromEvent(e),b=boxById(id);
  drag={mode:'box',id,dx:w.x-b.x,dy:w.y-b.y,moved:false};
  document.body.style.userSelect='none';e.preventDefault();
}
function startArrow(id,e){
  drag={mode:'arrow',fromId:id,tempWorld:worldFromEvent(e)};
  document.body.style.userSelect='none';e.preventDefault();e.stopPropagation();
}
function startPan(e){
  const v=view();
  drag={mode:'pan',sx:e.clientX,sy:e.clientY,px:v.panX,py:v.panY};
  canvas.classList.add('panning');
}
function startPinch(){
  const pts=[...pointers.values()];const v=view();
  const dist=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);
  pinch={dist:dist||1,mid:{x:(pts[0].x+pts[1].x)/2,y:(pts[0].y+pts[1].y)/2},panX:v.panX,panY:v.panY,zoom:v.zoom};
}
function updatePinch(){
  const pts=[...pointers.values()];if(pts.length<2)return;
  const dist=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);
  const mid={x:(pts[0].x+pts[1].x)/2,y:(pts[0].y+pts[1].y)/2};
  const r=canvas.getBoundingClientRect(),v=view();
  const nz=Math.min(3,Math.max(.2,pinch.zoom*(dist/pinch.dist)));
  // world point under the pinch's starting midpoint (using the view at pinch start)
  const wx=((pinch.mid.x-r.left)-pinch.panX)/pinch.zoom, wy=((pinch.mid.y-r.top)-pinch.panY)/pinch.zoom;
  v.zoom=nz;
  v.panX=(mid.x-r.left)-wx*nz;   // follow the moving midpoint → two-finger pan
  v.panY=(mid.y-r.top)-wy*nz;
  applyView();clearTimeout(canvas._z);canvas._z=setTimeout(save,250);
}
window.addEventListener('pointermove',e=>{
  if(pointers.has(e.pointerId))pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch){updatePinch();return;}
  if(!drag)return;
  if(drag.mode==='box'){
    const w=worldFromEvent(e),b=boxById(drag.id);
    b.x=Math.round(w.x-drag.dx);b.y=Math.round(w.y-drag.dy);drag.moved=true;
    positionBox(boxEl(drag.id),b);drawArrows();
  }else if(drag.mode==='arrow'){
    drag.tempWorld=worldFromEvent(e);drawArrows();
  }else if(drag.mode==='pan'){
    const v=view();v.panX=drag.px+(e.clientX-drag.sx);v.panY=drag.py+(e.clientY-drag.sy);applyView();
  }
});
function endPointer(e){
  pointers.delete(e.pointerId);
  try{canvas.releasePointerCapture(e.pointerId)}catch(_){}
  if(pinch&&pointers.size<2){pinch=null;if(pointers.size===1)return;} // wait until all lifted
  if(pointers.size>0)return;
  if(!drag){canvas.classList.remove('panning');document.body.style.userSelect='';return;}
  if(drag.mode==='box'){if(drag.moved){save();commit();}}
  else if(drag.mode==='arrow'){
    const el=document.elementFromPoint(e.clientX,e.clientY);
    const tgt=el&&el.closest('.box');
    if(tgt&&tgt.dataset.id!==drag.fromId)addArrow(drag.fromId,tgt.dataset.id);
    drag=null;drawArrows();document.body.style.userSelect='';canvas.classList.remove('panning');return;
  }else if(drag.mode==='pan'){canvas.classList.remove('panning');save();}
  drag=null;document.body.style.userSelect='';
}
window.addEventListener('pointerup',endPointer);
window.addEventListener('pointercancel',e=>{
  pointers.delete(e.pointerId);pinch=null;
  if(drag&&drag.mode==='arrow'){drag=null;drawArrows()}else{drag=null}
  document.body.style.userSelect='';canvas.classList.remove('panning');
});
canvas.addEventListener('wheel',e=>{
  e.preventDefault();closeBoxMenu();
  const v=view(),r=canvas.getBoundingClientRect();
  const mx=e.clientX-r.left,my=e.clientY-r.top;
  const wx=(mx-v.panX)/v.zoom,wy=(my-v.panY)/v.zoom;
  const f=e.deltaY<0?1.12:1/1.12;
  v.zoom=Math.min(3,Math.max(.2,v.zoom*f));
  v.panX=mx-wx*v.zoom;v.panY=my-wy*v.zoom;applyView();
  clearTimeout(canvas._z);canvas._z=setTimeout(save,250);
},{passive:false});
document.addEventListener('keydown',e=>{
  // Undo/redo work everywhere — field edits are in our history too, so this stays
  // consistent whether or not the cursor happens to be in the inspector.
  if((e.ctrlKey||e.metaKey)&&!e.altKey){
    const k=e.key.toLowerCase();
    if(k==='z'&&!e.shiftKey){e.preventDefault();if(document.activeElement)document.activeElement.blur();undo();return}
    if(k==='y'||(k==='z'&&e.shiftKey)){e.preventDefault();if(document.activeElement)document.activeElement.blur();redo();return}
  }
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName))return;
  if((e.key==='Delete'||e.key==='Backspace')&&selType){
    e.preventDefault();
    if(selType==='box')deleteBox(selId);else if(selType==='arrow')deleteArrow(selId);
  }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='d'&&selType==='box'){e.preventDefault();duplicateBox(selId);return}
  if(e.key==='Escape'&&document.getElementById('projPage')){closeProjectsPage();return}
  if(e.key==='Escape'){closeBoxMenu();if(drag&&drag.mode==='arrow'){drag=null;drawArrows()}clearSelection()}
});

/* ================= Diagram export (high-res image / PDF, no print dialog) ================= */
const EXPORT_SCALE=2.5;                 // render multiplier -> high-resolution output
const BOX_W=222;
const FSTACK='"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,Helvetica,Arial,sans-serif';
const FONTS={
  kind:'700 10.5px '+FSTACK, badge:'700 10px '+FSTACK,
  party:'650 13.5px '+FSTACK, grantee:'600 13.5px '+FSTACK,
  to:'11px '+FSTACK, meta:'11.5px '+FSTACK, metaLab:'600 11.5px '+FSTACK,
  schip:'700 10.5px '+FSTACK, h1:'700 18px '+FSTACK, h2:'12px '+FSTACK
};
function statChipText(st){
  if(!st)return null;
  const M={origin:['◆ Origin of title','#5b3ad6','#eceafe'],
    ok:['✓ Interest sourced','#1c7a43','#e7f6ec'],
    missing:['⚠ Missing '+(st.gap?fracStr(st.gap):''),'#b02a37','#fdeced'],
    unsourced:['⚠ No prior deed','#b02a37','#fdeced'],
    over:['⚠ Over '+(st.gap?fracStr(st.gap):''),'#8a5a00','#fff4dd']};
  const m=M[st.state];return m?{text:m[0],c:m[1],bg:m[2]}:null;
}
function wrapLines(ctx,text,maxW){
  const words=(''+text).split(/\s+/).filter(Boolean);
  if(!words.length)return[''];
  const lines=[];let cur=words[0];
  for(let i=1;i<words.length;i++){
    const t=cur+' '+words[i];
    if(ctx.measureText(t).width<=maxW)cur=t;else{lines.push(cur);cur=words[i];}
  }
  lines.push(cur);
  const out=[];
  lines.forEach(l=>{
    if(ctx.measureText(l).width<=maxW){out.push(l);return;}
    let s='';
    for(const ch of l){if(s&&ctx.measureText(s+ch).width>maxW){out.push(s);s=ch}else s+=ch}
    if(s)out.push(s);
  });
  return out;
}
// Compute a box's drawing plan and total height (mirrors the on-screen card layout).
function layoutBox(ctx,b,parcel){
  const PAD=11, inner=BOX_W-PAD*2, LH=17;
  const k=KINDS[b.kind]||KINDS.deed;
  const rows=[];let y=9;
  rows.push({t:'chip',label:k.label.toUpperCase(),c:k.c,bg:k.bg,
    badge:(b.partial&&OWNERSHIP.has(b.kind))?fracStr(interestOf(b))+' interest':null});
  y+=17+6;
  if(b.kind==='note'){
    ctx.font=FONTS.party;
    const lines=wrapLines(ctx,b.notes||'Note',inner);
    rows.push({t:'lines',font:FONTS.party,color:'#1f2733',lines,lh:LH});y+=lines.length*LH;
  }else{
    ctx.font=FONTS.party;
    const gl=wrapLines(ctx,b.grantor||'Grantor',inner);
    rows.push({t:'lines',font:FONTS.party,color:'#1f2733',lines:gl,lh:LH});y+=gl.length*LH;
    rows.push({t:'to'});y+=15;
    ctx.font=FONTS.grantee;
    const gr=wrapLines(ctx,b.grantee||'Grantee',inner);
    rows.push({t:'lines',font:FONTS.grantee,color:'#33455f',lines:gr,lh:LH});y+=gr.length*LH;
    const meta=[];
    if(b.idate)meta.push(['Inst',b.idate]);
    if(b.rdate)meta.push(['Rec',b.rdate]);
    if(b.docnum)meta.push(['Doc#',b.docnum]);
    if(b.bookpage)meta.push(['Bk/Pg',b.bookpage]);
    if(b.notes)meta.push(['Note',b.notes]);
    if(meta.length){
      y+=7;rows.push({t:'sep'});y+=7;
      ctx.font=FONTS.meta;
      const mrows=meta.map(([lab,val])=>({lab,vlines:wrapLines(ctx,val,inner-38)}));
      rows.push({t:'meta',rows:mrows});
      mrows.forEach(r=>{y+=r.vlines.length*15+2});
    }
  }
  const chip=statChipText(interestStatus(b,parcel));
  if(chip){y+=9;rows.push({t:'schip',chip});y+=19}
  y+=11;
  return {w:BOX_W,h:Math.round(y),rows};
}
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}
function pill(ctx,x,y,text,font,color,bg){
  ctx.font=font;const w=ctx.measureText(text).width+14,h=16;
  ctx.fillStyle=bg;roundRect(ctx,x,y,w,h,8);ctx.fill();
  ctx.fillStyle=color;ctx.textBaseline='middle';ctx.fillText(text,x+7,y+h/2+.5);
  ctx.textBaseline='alphabetic';return w;
}
function drawBox(ctx,b,L,parcel){
  const x=b.x,y=b.y,PAD=11;
  const k=KINDS[b.kind]||KINDS.deed;
  const st=interestStatus(b,parcel);
  // card
  ctx.save();
  ctx.shadowColor='rgba(20,30,50,.10)';ctx.shadowBlur=8;ctx.shadowOffsetY=2;
  ctx.fillStyle='#fff';roundRect(ctx,x,y,L.w,L.h,10);ctx.fill();
  ctx.restore();
  ctx.strokeStyle=(st&&(st.state==='missing'||st.state==='unsourced'))?'#e0616b':
                  (st&&st.state==='over')?'#d99a2b':'#d9dee6';
  ctx.lineWidth=(st&&st.state!=='ok'&&st.state!=='origin')?2:1;
  roundRect(ctx,x+.5,y+.5,L.w-1,L.h-1,10);ctx.stroke();
  // top accent
  ctx.save();roundRect(ctx,x,y,L.w,L.h,10);ctx.clip();
  ctx.fillStyle=k.c;ctx.fillRect(x,y,L.w,3);ctx.restore();
  let cy=y+9;
  L.rows.forEach(r=>{
    if(r.t==='chip'){
      const w=pill(ctx,x+PAD,cy,r.label,FONTS.kind,r.c,r.bg);
      if(r.badge)pill(ctx,x+PAD+w+4,cy,r.badge,FONTS.badge,'#5b3ad6','#efeafe');
      cy+=17+6;
    }else if(r.t==='lines'){
      ctx.font=r.font;ctx.fillStyle=r.color;
      r.lines.forEach(l=>{ctx.fillText(l,x+PAD,cy+12.5);cy+=r.lh});
    }else if(r.t==='to'){
      ctx.font=FONTS.to;ctx.fillStyle='#6b7686';ctx.textAlign='center';
      ctx.fillText('▼ conveys to',x+L.w/2,cy+11);ctx.textAlign='left';cy+=15;
    }else if(r.t==='sep'){
      cy+=7;ctx.strokeStyle='#e6eaf0';ctx.lineWidth=1;ctx.setLineDash([3,3]);
      ctx.beginPath();ctx.moveTo(x+PAD,cy-.5);ctx.lineTo(x+L.w-PAD,cy-.5);ctx.stroke();
      ctx.setLineDash([]);cy+=7;
    }else if(r.t==='meta'){
      r.rows.forEach(m=>{
        ctx.font=FONTS.metaLab;ctx.fillStyle='#93a0b2';ctx.fillText(m.lab,x+PAD,cy+11);
        ctx.font=FONTS.meta;ctx.fillStyle='#556';
        m.vlines.forEach((v,i)=>{ctx.fillText(v,x+PAD+38,cy+11+i*15)});
        cy+=m.vlines.length*15+2;
      });
    }else if(r.t==='schip'){
      cy+=9;pill(ctx,x+PAD,cy,r.chip.text,FONTS.schip,r.chip.c,r.chip.bg);cy+=19;
    }
  });
}
function drawArrowTo(ctx,sx,sy,tx,ty){
  const a=Math.atan2(ty-sy,tx-sx),HL=11,HW=4.6;
  const ex=tx-Math.cos(a)*HL*.9, ey=ty-Math.sin(a)*HL*.9;
  ctx.strokeStyle='#4a5a72';ctx.lineWidth=1.8;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(ex,ey);ctx.stroke();
  ctx.fillStyle='#4a5a72';ctx.beginPath();
  ctx.moveTo(tx,ty);
  ctx.lineTo(tx-Math.cos(a)*HL+Math.sin(a)*HW, ty-Math.sin(a)*HL-Math.cos(a)*HW);
  ctx.lineTo(tx-Math.cos(a)*HL-Math.sin(a)*HW, ty-Math.sin(a)*HL+Math.cos(a)*HW);
  ctx.closePath();ctx.fill();
}
// Render one parcel to a high-resolution canvas, sized to the actual content (never squeezed).
function renderParcelCanvas(p,scale){
  scale=scale||EXPORT_SCALE;
  const meas=document.createElement('canvas').getContext('2d');
  const L={};p.boxes.forEach(b=>{L[b.id]=layoutBox(meas,b,p)});
  const PAD=34, HEAD=64;
  let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
  if(p.boxes.length){
    p.boxes.forEach(b=>{const l=L[b.id];
      minX=Math.min(minX,b.x);minY=Math.min(minY,b.y);
      maxX=Math.max(maxX,b.x+l.w);maxY=Math.max(maxY,b.y+l.h);});
  }else{minX=0;minY=0;maxX=420;maxY=40}
  const cw=(maxX-minX)+PAD*2, ch=(maxY-minY)+PAD*2+HEAD;
  const cv=document.createElement('canvas');
  cv.width=Math.max(1,Math.round(cw*scale));cv.height=Math.max(1,Math.round(ch*scale));
  const ctx=cv.getContext('2d');
  ctx.scale(scale,scale);
  ctx.fillStyle='#fff';ctx.fillRect(0,0,cw,ch);
  ctx.textBaseline='alphabetic';
  // header
  ctx.font=FONTS.h1;ctx.fillStyle='#1a2739';
  ctx.fillText(state.project||'Title Chain',PAD,30);
  ctx.font=FONTS.h2;ctx.fillStyle='#55637a';
  const sub=p.name+'   •   '+p.boxes.length+' instrument'+(p.boxes.length!==1?'s':'')+
    '   •   '+p.arrows.length+' conveyance'+(p.arrows.length!==1?'s':'')+
    '   •   '+new Date().toLocaleDateString();
  ctx.fillText(sub,PAD,48);
  ctx.strokeStyle='#22344b';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(PAD,58);ctx.lineTo(cw-PAD,58);ctx.stroke();
  // shift into content space
  ctx.translate(PAD-minX,HEAD+PAD-minY);
  // arrows first (under boxes)
  const rOf=id=>{const b=p.boxes.find(x=>x.id===id);if(!b)return null;const l=L[id];return{x:b.x,y:b.y,w:l.w,h:l.h}};
  p.arrows.forEach(a=>{
    const A=rOf(a.from),B=rOf(a.to);if(!A||!B)return;
    const cA={x:A.x+A.w/2,y:A.y+A.h/2},cB={x:B.x+B.w/2,y:B.y+B.h/2};
    const s=edgePoint(A,cB),t=edgePoint(B,cA);
    drawArrowTo(ctx,s.x,s.y,t.x,t.y);
  });
  p.boxes.forEach(b=>drawBox(ctx,b,L[b.id],p));
  return cv;
}
/* ---- file helpers ---- */
function dataURLToBytes(u){const bin=atob(u.split(',')[1]);const a=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a;}
function downloadBlob(blob,fname){
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download=fname;a.rel='noopener';a.style.display='none';
  document.body.appendChild(a);a.click();
  setTimeout(()=>{try{document.body.removeChild(a)}catch(_){}URL.revokeObjectURL(url)},1200);
}
function safeName(s){return (s||'title-chain').replace(/[^a-z0-9\-_]+/gi,'_').replace(/^_+|_+$/g,'')||'title-chain'}
/* ---- minimal PDF writer: one page per parcel, full-size embedded JPEG ---- */
function buildPDFBlob(imgs){
  const chunks=[];let len=0;
  const push=u=>{chunks.push(u);len+=u.length};
  const pushS=s=>{const a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i)&0xff;push(a)};
  const off=[];
  pushS('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');
  const N=imgs.length;
  const objStart=n=>{off[n]=len;pushS(n+' 0 obj\n')};
  const objEnd=()=>pushS('endobj\n');
  objStart(1);pushS('<< /Type /Catalog /Pages 2 0 R >>\n');objEnd();
  objStart(2);pushS('<< /Type /Pages /Kids ['+imgs.map((_,i)=>(3+i*3)+' 0 R').join(' ')+'] /Count '+N+' >>\n');objEnd();
  imgs.forEach((im,i)=>{
    const pn=3+i*3,imn=4+i*3,cn=5+i*3;
    const W=im.pw.toFixed(2),H=im.ph.toFixed(2);
    objStart(pn);
    pushS('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+W+' '+H+'] /Resources << /XObject << /Im0 '+imn+' 0 R >> >> /Contents '+cn+' 0 R >>\n');
    objEnd();
    objStart(imn);
    pushS('<< /Type /XObject /Subtype /Image /Width '+im.w+' /Height '+im.h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+im.bytes.length+' >>\nstream\n');
    push(im.bytes);pushS('\nendstream\n');objEnd();
    const content='q '+W+' 0 0 '+H+' 0 0 cm /Im0 Do Q\n';
    objStart(cn);pushS('<< /Length '+content.length+' >>\nstream\n'+content+'endstream\n');objEnd();
  });
  const xref=len,total=2+N*3+1;
  let x='xref\n0 '+total+'\n0000000000 65535 f \n';
  for(let n=1;n<total;n++)x+=String(off[n]||0).padStart(10,'0')+' 00000 n \n';
  pushS(x);
  pushS('trailer\n<< /Size '+total+' /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF\n');
  const out=new Uint8Array(len);let o=0;chunks.forEach(c=>{out.set(c,o);o+=c.length});
  return new Blob([out],{type:'application/pdf'});
}

/* ---- Print to paper (or Save as PDF from the print dialog) ----
   The full-size PDF above is for viewing. This lays the chain onto real sheets:
   either scaled to fit one page, or at readable size tiled across several. */
const PAPER={letter:{w:8.5,h:11,label:'Letter'},legal:{w:8.5,h:14,label:'Legal'},
             tabloid:{w:11,h:17,label:'Tabloid 11×17'},a4:{w:8.27,h:11.69,label:'A4'}};
const PRINT_MARGIN=0.4;               // inches
function openPrintDialog(){
  const p=activeParcel();
  const cv=renderParcelCanvas(p,EXPORT_SCALE);
  const dw=cv.width/EXPORT_SCALE, dh=cv.height/EXPORT_SCALE;
  const est=(size,land)=>{
    const pg=PAPER[size], W=(land?pg.h:pg.w)-PRINT_MARGIN*2, H=(land?pg.w:pg.h)-PRINT_MARGIN*2;
    const cols=Math.ceil(dw/(W*96)), rows=Math.ceil(dh/(H*96));
    return cols*rows*state.parcels.length;
  };
  showModalPanel({title:'Print',
    bodyHTML:`<p class="xnote">Sends the chain to your printer. In the print dialog you can choose a printer, or pick <b>Save as PDF</b> for a paper-sized file.</p>
      <div class="two">
        <div class="fld"><label>Paper</label><select id="pp_size">${
          Object.keys(PAPER).map(k=>`<option value="${k}"${k==='letter'?' selected':''}>${PAPER[k].label}</option>`).join('')}</select></div>
        <div class="fld"><label>Orientation</label><select id="pp_orient">
          <option value="landscape" selected>Landscape</option><option value="portrait">Portrait</option></select></div>
      </div>
      <div class="fld" style="margin-top:10px"><label>Size</label><select id="pp_mode">
        <option value="fit" selected>Fit each parcel to one page</option>
        <option value="tile">Full size — continue across pages</option></select></div>
      <p class="xnote" id="pp_est" style="margin-top:10px"></p>
      <label class="chk"><input type="checkbox" id="pp_all"> Print every parcel (otherwise just this one)</label>`,
    buttons:[{label:'Print',primary:true,onClick:doPrint},{label:'Cancel',onClick:closeModalPanel}],
    onShow:()=>{
      const upd=()=>{
        const m=document.getElementById('pp_mode').value;
        const n=m==='fit'?(document.getElementById('pp_all').checked?state.parcels.length:1)
                         :est(document.getElementById('pp_size').value,document.getElementById('pp_orient').value==='landscape');
        document.getElementById('pp_est').innerHTML=m==='fit'
          ? `Everything shrinks onto <b>${document.getElementById('pp_all').checked?state.parcels.length:1}</b> sheet(s). Best for a quick reference copy.`
          : `About <b>${n}</b> sheet(s) at full readability — tape them together for a wall copy.`;
      };
      ['pp_size','pp_orient','pp_mode','pp_all'].forEach(id=>document.getElementById(id).addEventListener('change',upd));
      upd();
    }});
}
function doPrint(){
  const size=document.getElementById('pp_size').value;
  const land=document.getElementById('pp_orient').value==='landscape';
  const mode=document.getElementById('pp_mode').value;
  const all=document.getElementById('pp_all').checked;
  closeModalPanel();
  const pg=PAPER[size];
  const pw=land?pg.h:pg.w, ph=land?pg.w:pg.h;
  const availW=(pw-PRINT_MARGIN*2)*96, availH=(ph-PRINT_MARGIN*2)*96;   // CSS px
  const parcels=all?state.parcels:[activeParcel()];
  const sheets=[];
  parcels.forEach(p=>{
    const cv=renderParcelCanvas(p,EXPORT_SCALE);
    const url=cv.toDataURL('image/jpeg',0.94);
    const dw=cv.width/EXPORT_SCALE, dh=cv.height/EXPORT_SCALE;
    if(mode==='fit'){
      const s=Math.min(availW/dw,availH/dh,1);
      sheets.push({url,iw:dw*s,ih:dh*s,ox:0,oy:0,label:esc(p.name)});
    }else{
      const cols=Math.max(1,Math.ceil(dw/availW)), rows=Math.max(1,Math.ceil(dh/availH));
      for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)
        sheets.push({url,iw:dw,ih:dh,ox:-c*availW,oy:-r*availH,
          label:esc(p.name)+(cols*rows>1?` &mdash; row ${r+1} of ${rows}, col ${c+1} of ${cols}`:'')});
    }
  });
  if(!sheets.length){toast('Nothing to print');return}
  let w=null;try{w=window.open('','_blank')}catch(_){}
  if(!w||!w.document){showPrintBlocked();return}
  const proj=esc(state.project||'Title Chain');
  const body=sheets.map((s,i)=>`<div class="sheet">
      <div class="clip"><img src="${s.url}" style="width:${s.iw}px;height:${s.ih}px;left:${s.ox}px;top:${s.oy}px"></div>
      <div class="foot"><span>${proj} &mdash; ${s.label}</span><span>${i+1} / ${sheets.length}</span></div>
    </div>`).join('');
  const doc=w.document;doc.open();
  doc.write(`<!doctype html><html><head><meta charset="utf-8"><title>${proj}</title><style>
    @page{size:${size==='a4'?'A4':size} ${land?'landscape':'portrait'};margin:${PRINT_MARGIN}in}
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;background:#666}
    .sheet{position:relative;width:${availW}px;height:${availH}px;overflow:hidden;background:#fff;
      margin:0 auto 16px;box-shadow:0 2px 10px rgba(0,0,0,.4);break-after:page;page-break-after:always}
    .sheet:last-child{break-after:auto;page-break-after:auto}
    .clip{position:absolute;inset:0;overflow:hidden}
    .clip img{position:absolute;image-rendering:auto}
    .foot{position:absolute;left:0;right:0;bottom:2px;display:flex;justify-content:space-between;
      font:10px -apple-system,Segoe UI,Roboto,sans-serif;color:#8a93a0;padding:0 2px}
    @media print{html,body{background:#fff}.sheet{margin:0;box-shadow:none}}
  </style></head><body>${body}</body></html>`);
  doc.close();
  const go=()=>setTimeout(()=>{try{w.focus();w.print()}catch(_){}} ,350);
  if(doc.readyState==='complete')go();else w.onload=go;
  toast(sheets.length+' sheet'+(sheets.length!==1?'s':'')+' ready');
}
function showPrintBlocked(){
  showModalPanel({title:'Allow pop-ups to print',
    bodyHTML:`<p class="xnote">The print view opens in a new tab, and your browser blocked it.</p>
      <div class="gwarn">Click the blocked pop-up icon in the address bar, choose <b>Always allow</b> for this site, then press Print again.</div>`,

function exportImage(kind){           // 'jpg' | 'png' — current parcel
  const p=activeParcel();
  const cv=renderParcelCanvas(p);
  const mime=kind==='png'?'image/png':'image/jpeg';
  const url=cv.toDataURL(mime,kind==='png'?undefined:0.92);
  const fname=safeName(state.project)+'_'+safeName(p.name)+'.'+(kind==='png'?'png':'jpg');
  if(isFramed()){showImagePanel(url,fname,cv.width,cv.height);return}
  fetch(url).then(r=>r.blob()).then(b=>{downloadBlob(b,fname);
    toast('Saved '+fname+'  ('+cv.width+'×'+cv.height+')');})
    .catch(()=>{downloadBlob(new Blob([dataURLToBytes(url)],{type:mime}),fname);toast('Saved '+fname)});
  closeModalPanel();
}
function exportPDF(){                 // all parcels, one page each, full size
  const imgs=[];
  state.parcels.forEach(p=>{
    const cv=renderParcelCanvas(p);
    const url=cv.toDataURL('image/jpeg',0.92);
    let pw=(cv.width/EXPORT_SCALE)*0.75, ph=(cv.height/EXPORT_SCALE)*0.75;   // css px -> pt
    const cap=14000;                                                          // PDF page limit
    if(pw>cap||ph>cap){const f=Math.min(cap/pw,cap/ph);pw*=f;ph*=f}
    imgs.push({bytes:dataURLToBytes(url),w:cv.width,h:cv.height,pw,ph});
  });
  if(!imgs.length){toast('Nothing to export');return}
  const blob=buildPDFBlob(imgs);
  const fname=safeName(state.project)+'.pdf';
  if(isFramed()){showPDFPanel(blob,fname);return}
  downloadBlob(blob,fname);
  toast('Saved '+fname+'  ('+imgs.length+' page'+(imgs.length!==1?'s':'')+')');
  closeModalPanel();
}
